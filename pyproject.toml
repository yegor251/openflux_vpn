[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openflux-vpn"
version = "0.2.0"
description = "Per-user OpenFlux VPN channels: docprovider (carrier docs) + oflux-admin (control plane)"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "paramiko>=3.4",
    "qrcode>=7.4",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "aiogram>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "browser-cookie3>=0.16",  # scripts/export_yandex_cookies.py
]

[project.scripts]
oflux-admin = "oflux_admin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docprovider", "src/oflux_admin", "src/oflux_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-тесты (реальные сервисы, секреты) жили в tests/live и были удалены
# после приёмки 2026-10-18; восстанавливаются из git-истории при нужде.
addopts = "-m 'not live'"
markers = [
    "live: tests against real Yandex/Mail.ru accounts (deselect with '-m \"not live\"')",
]
